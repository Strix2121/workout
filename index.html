<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a3bf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تمارين">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234a3bf0'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E">
<title>برنامجي التدريبي | My Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f6;--card:#ffffff;--tx:#141a2e;--mu:#6b7390;--ac:#5b4bff;--tint:#efedff;--ln:#e1e4ef;--hero:linear-gradient(135deg, #4a3bf0, #6c5ce7);--p:#ff5d5d;--c:#ffb020;--f:#12b5a6;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1120;--card:#171c31;--tx:#eef0fb;--mu:#99a0bf;--ac:#8a7dff;--tint:#252252;--ln:#262c47;--hero:linear-gradient(135deg, #3a30b8, #4a3bf0);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;transition:background-color .2s, border-color .2s}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Tajawal,Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
html[lang="en"] body{font-family:Inter,Tajawal,system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
button,input,select{font:inherit;color:inherit}
button{border:0;background:var(--tint);color:var(--ac);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700}
button:active{transform:scale(.96)}
input,select{width:100%;min-width:0;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px;text-align:center;font-weight:700}
input:focus,select:focus{outline:0;border-color:var(--ac)}
input::placeholder{font-weight:400;color:var(--mu)}
h2,h3,p{margin:0}

/* nav */
#nav{position:fixed;inset:auto 0 0 0;z-index:8;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln);backdrop-filter:blur(10px)}
#nav button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:0;background:none;color:var(--mu);font-size:12px;padding:4px}
#nav button span{font-size:22px;line-height:1.3}
#nav button.on{color:var(--ac);font-weight:800}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;box-shadow:0 10px 25px -5px rgba(74,59,240,0.3)}
.hero h2{font-size:28px;font-weight:800;line-height:1.2}
.hero small{opacity:.85}
.hero input{background:rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:800;padding:4px 8px;width:150px;margin:2px -8px;border-radius:8px}
.hero input::placeholder{color:rgba(255,255,255,.7)}
.hero .st{display:flex;gap:16px;margin-top:8px;font-size:14px}
.hero b{font-size:18px}
.ring{position:relative;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}

/* days */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.days button{flex:0 0 auto;width:66px;padding:10px 0;background:var(--card);color:var(--tx);display:flex;flex-direction:column;align-items:center;line-height:1.25;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.days button b{font-size:18px}
.days small{font-size:11px;color:var(--mu)}
.days button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(91,75,255,.3)}
.days button.on small{color:#fff;opacity:.9}
.days button.rest:not(.on){opacity:.65}

/* exercise */
.ex{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.ex.fin{box-shadow:inset 0 0 0 2px var(--f)}
.eh{display:flex;align-items:center;gap:10px}
.eh .n{flex:none;width:32px;height:32px;border-radius:10px;background:var(--tint);color:var(--ac);display:grid;place-items:center;font-weight:800}
.eh h3{flex:1;font-size:17px;font-weight:700;line-height:1.3}
.eh button{padding:4px 8px;background:none;color:var(--mu)}
.chips{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:4px 10px;font-size:14px;color:var(--mu)}
.chip input{width:52px;padding:4px;background:var(--card)}
.chip button{padding:2px 9px;font-size:18px;line-height:1.2}
.cols,.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center}
.cols{font-size:12px;color:var(--mu);text-align:center;margin-bottom:4px}
.set{margin:6px 0}
.set>span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-weight:700;color:var(--mu)}
.set .ok{width:44px;height:44px;border-radius:50%;padding:0;background:var(--bg);color:transparent;font-size:20px;transition:transform .2s, background-color .2s}
.set.done .ok{background:var(--f);color:#fff;transform:scale(1.05)}
.set.done input{background:var(--tint)}
.set.done>span{background:var(--f);color:#fff}
.add{width:100%;background:var(--ac);color:#fff;padding:14px;font-size:16px;border-radius:16px;box-shadow:0 4px 12px rgba(91,75,255,.25)}
.nt{color:var(--mu);font-size:13px;margin-top:12px}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}

/* meals & cards */
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.dt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dt b{font-size:17px}
.big{display:flex;align-items:center;gap:16px}
.big h2{font-size:30px;font-weight:800;line-height:1.1}
.mac{flex:1;display:grid;gap:8px}
.mac div{font-size:13px;color:var(--mu)}
.mb{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:2px}
.mb i{display:block;height:100%;border-radius:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.ml{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ml small{color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px}
.ch{width:100%;height:auto}
.ch text{font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr{display:grid;gap:6px;max-height:230px;overflow:auto;margin:10px 0}
.fb{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);color:var(--tx);font-weight:500;padding:10px;border-radius:12px;text-align:start}
.fb small{color:var(--mu);white-space:nowrap}
.fsel{background:var(--tint);border-radius:16px;padding:14px;margin-top:8px}
details summary{cursor:pointer;font-weight:700}

/* timer */
#tb{position:fixed;inset:auto 14px calc(84px + env(safe-area-inset-bottom)) 14px;max-width:532px;margin:auto;z-index:9;background:var(--tx);color:var(--bg);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tb[hidden]{display:none}
#tb button{background:rgba(128,128,128,.3);color:inherit}
</style>
</head>
<body>
<main id="v"></main>
<div id="tb" hidden><span></span><button onclick="clearInterval(T);tb.hidden=true">إيقاف</button></div>
<nav id="nav"></nav>
<script>
const K='ali-shahidah-v2';
const I18N={
 ar:{
  ex:'التمارين', cal:'السعرات', chart:'الرسم', set:'الإعدادات',
  day:'اليوم', week:'الأسبوع', rest:'راحة', sets:'مجموعات',
  weight:'الوزن (كغ)', reps:'العدات', addEx:'+ تمرين جديد',
  restTime:'راحة', startTimer:'⏱ ابدأ', clearDay:'صفّر علامات اليوم',
  restDay:'يوم راحة 😴<br>ضيف تمرين إذا بدك تتمرن اليوم.',
  delEx:'احذف التمرين؟', exName:'اسم التمرين',
  goal:'الهدف اليومي', cals:'سعرة', left:'سعرة باقية', over:'سعرة فوق الهدف',
  protein:'بروتين', carbs:'كارب', fats:'دهون',
  calc:'🧮 حاسبة السعرات', search:'ابحث: دجاج، رز، بيض...',
  custom:'إضافة يدوية (أكلة مش بالقائمة)', lang:'اللغة / Language'
 },
 en:{
  ex:'Workouts', cal:'Calories', chart:'Charts', set:'Settings',
  day:'Day', week:'Week', rest:'Rest', sets:'Sets',
  weight:'Weight (kg)', reps:'Reps', addEx:'+ Add Exercise',
  restTime:'Rest', startTimer:'⏱ Start', clearDay:'Reset Today\'s Checkmarks',
  restDay:'Rest Day 😴<br>Add an exercise if you plan to train today.',
  delEx:'Delete Exercise?', exName:'Exercise Name',
  goal:'Daily Goal', cals:'kcal', left:'kcal left', over:'kcal over limit',
  protein:'Protein', carbs:'Carbs', fats:'Fats',
  calc:'🧮 Calorie Calculator', search:'Search: Chicken, Rice, Eggs...',
  custom:'Manual Entry (Item not in list)', lang:'Language / اللغة'
 }
};

const mk=(n,s,r)=>({n,s,r,wk:{1:{w:Array(s).fill(''),q:Array(s).fill(''),d:Array(s).fill(false)}}});
const def=()=>({lang:'ar',goal:2500,week:1,meals:{},days:[
{t:'Push',e:[mk('ضغط دمبل مائل للأعلى (صدر)',4,3),mk('فراشة صدر',3,2),mk('ضغط دمبل جانبي (أكتاف)',2,3),mk('رفرفة جانبية (كتف جانبي)',3,2),mk('دفع سيخ خلف الرأس (ترايسبس)',3,2),mk('دفع سيخ للأسفل (ترايسبس)',3,2),mk('طحن معدة بالحبل',3,2)]},
{t:'Pull',e:[mk('سحب أمامي ضيق',3,3),mk('تجديف ظهر ضيق',3,2),mk('تجديف ظهر عريض',2,2),mk('كيبل يد واحدة (كتف خلفي)',3,1.5),mk('دمبل متسع مائل (بايسبس)',3,1.5),mk('مطرقة',3,1.5),mk('كرسي روماني',3,1.5)]},
{t:'راحة',e:[]},
{t:'Legs',e:[mk('هاك سكوات',3,3),mk('RDL هامسترينغ',3,3),mk('رد أمامي',3,2),mk('رد خلفي',3,2),mk('مقرّبات',3,1.5),mk('بطات واقفة',3,1.5),mk('فواصل يد واحدة',2,1.5)]},
{t:'راحة',e:[]},
{t:'Upper',e:[mk('فتح كيبل صدر علوي',3,2),mk('سحب بولي داون',3,3),mk('رفرفة جانبية بالكيبل',3,2),mk('سحب يد واحدة (كتف خلفي)',2,1.5),mk('دفع سيخ خلف الرأس (ترايسبس)',3,2),mk('تبادل دمبل (بايسبس)',2,1.5),mk('دوران جذع بالكيبل',2,1.5)]},
{t:'راحة',e:[]}]});

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||def();S.lang=S.lang||'ar';
document.documentElement.lang=S.lang;
document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';

function t(k){return (I18N[S.lang]&&I18N[S.lang][k])||k}
function mig(d){d.week=d.week||1;d.days.forEach(y=>y.e.forEach(x=>{if(!x.wk){x.wk={1:{w:x.w||[],q:x.q||(x.w||[]).map(()=>''),d:x.d||[]}};delete x.w;delete x.q;delete x.d}}));return d}
mig(S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());

let em=-1,tab='w',di=0,date=today(),T=null,pg=null;
const go=tabName=>{tab=tabName;scrollTo(0,0);R()};
function ring(p,sz,sw,col,track){const r=(sz-sw)/2,c=2*Math.PI*r;return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}"/></svg>`}

function R(){
 document.documentElement.lang=S.lang;
 document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';
 $('#nav').innerHTML=[['w','🏋️',t('ex')],['m','🍽️',t('cal')],['c','📊',t('chart')],['s','⚙️',t('set')]].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
 $('#v').innerHTML=bn()+(tab=='w'?RW():tab=='m'?RM():tab=='c'?RC():RS());
 if(tab=='m'){fs('');cr()}
}

/* ---------- WORKOUTS ---------- */
function RW(){
 const D=S.days[di];
 const tt=D.e.reduce((a,x)=>a+x.s,0),dn=D.e.reduce((a,x)=>a+mg(x,S.week).d.filter(Boolean).length,0),ex=D.e.filter(x=>mg(x,S.week).d.every(Boolean)).length,p=tt?dn/tt:0;
 let h=`<div class="hero"><div><small>${t('day')} ${di+1} / 7</small><br><input value="${esc(D.t)}" onchange="S.days[di].t=this.value||'Day';save();R()"><div class="st"><span><b>${ex}/${D.e.length}</b> ${t('ex')}</span><span><b>${dn}/${tt}</b> ${t('sets')}</span></div></div>
 <div class="ring">${ring(p,84,9,'#fff','rgba(255,255,255,.25)')}<b>${Math.round(p*100)}%</b></div></div>
 <div class="card dt" style="margin:0 0 10px;padding:8px 10px"><button onclick="sw(-1)">${S.lang=='ar'?'›':'‹'}</button><b>${t('week')} ${S.week}</b><button onclick="sw(1)">${S.lang=='ar'?'‹':'›'}</button></div><div class="days">${S.days.map((d,i)=>`<button class="${i==di?'on':''} ${d.e.length?'':'rest'}" onclick="di=${i};R()"><b>${i+1}</b><small>${esc(d.t)}</small></button>`).join('')}</div>`;
 if(!D.e.length)h+=`<div class="empty">${t('restDay')}</div>`;
 D.e.forEach((x,i)=>{
  const o=mg(x,S.week);h+=`<div class="ex ${o.d.every(Boolean)?'fin':''}"><div class="eh"><span class="n">${i+1}</span><h3>${esc(x.n)}</h3><button onclick="pgt(${i})">📈</button><button onclick="ren(${i})">✎</button><button onclick="del(${i})">🗑</button></div>
  <div class="chips"><label class="chip">${t('restTime')} <input type="number" step="0.5" min="0" value="${x.r}" onchange="S.days[di].e[${i}].r=+this.value;save()"> m</label><button onclick="tm(S.days[di].e[${i}].r)">${t('startTimer')}</button>
  <span class="chip"><button onclick="sc(${i},-1)">−</button>${x.s} ${t('sets')}<button onclick="sc(${i},1)">+</button></span></div>
  <div class="cols"><span></span><span>${t('weight')}</span><span>${t('reps')}</span><span></span></div>
  ${o.w.map((w,j)=>`<div class="set ${o.d[j]?'done':''}"><span>${j+1}</span><input type="number" inputmode="decimal" placeholder="0" value="${esc(w)}" onchange="E(${i}).w[${j}]=this.value;save()"><input type="number" inputmode="numeric" placeholder="0" value="${esc(o.q[j]||'')}" onchange="E(${i}).q[${j}]=this.value;save()"><button class="ok" onclick="ck(${i},${j})">✓</button></div>`).join('')}${pg&&pg[0]==di&&pg[1]==i?pc(x):''}</div>`;
 });
 return h+`<button class="add" onclick="ad()">${t('addEx')}</button><p class="nt"><button onclick="rd()">${t('clearDay')}</button></p>`;
}
function mg(x,wk){
 x.wk=x.wk||{};
 if(!x.wk[wk]){let p=null;for(let k=wk-1;k>=1;k--)if(x.wk[k]){p=x.wk[k];break}
  x.wk[wk]={w:p?p.w.slice():[],q:p?p.q.slice():[],d:[]}}
 const o=x.wk[wk];
 while(o.w.length<x.s){o.w.push('');o.q.push('')}while(o.w.length>x.s){o.w.pop();o.q.pop()}
 o.d=Array.from({length:x.s},(_,i)=>!!o.d[i]);
 return o}
function E(i){return mg(S.days[di].e[i],S.week)}
function sw(n){S.week=Math.max(1,S.week+n);save();R()}
function ck(i,j){const x=S.days[di].e[i],o=E(i);o.d[j]=!o.d[j];save();if(o.d[j]&&j<x.s-1&&S.at!==false)tm(x.r);R()}
function rd(){S.days[di].e.forEach(x=>{const o=mg(x,S.week);o.d=o.d.map(()=>false)});save();R()}
function ren(i){const x=S.days[di].e[i],n=prompt(t('exName'),x.n);if(n){x.n=n;save();R()}}
function del(i){if(confirm(t('delEx'))){S.days[di].e.splice(i,1);save();R()}}
function sc(i,d){const x=S.days[di].e[i];if(x.s+d<1)return;x.s+=d;save();R()}
function ad(){const n=prompt(t('exName'));if(n){S.days[di].e.push(mk(n,3,2));save();R()}}
function tm(m){
 clearInterval(T);let s=Math.round(m*60);const b=$('#tb'),sp=b.querySelector('span');b.hidden=false;
 const u=()=>{sp.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};u();
 T=setInterval(()=>{s--;u();if(s<=0){clearInterval(T);sp.textContent='💪 Done!';if(navigator.vibrate)navigator.vibrate([300,100,300]);setTimeout(()=>b.hidden=true,4000)}},1000);
}

/* ---------- CALORIES ---------- */
const tot=d=>(S.meals[d]||[]).reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
const dname=d=>d==today()?(S.lang=='ar'?'اليوم':'Today'):new Date(d+'T12:00').toLocaleDateString(S.lang=='ar'?'ar':'en-US',{weekday:'short',month:'short',day:'numeric'});
function sd(n){em=-1;const d=new Date(date+'T12:00');d.setDate(d.getDate()+n);date=iso(d);R()}
function datebar(){return `<div class="dt"><button onclick="sd(-1)">${S.lang=='ar'?'›':'‹'}</button><b>${dname(date)}</b><button onclick="sd(1)">${S.lang=='ar'?'‹':'›'}</button></div>`}
function RM(){
 const L=S.meals[date]||[],tr=tot(date),left=S.goal-tr.k;
 const mb=(l,v,col,g)=>`<div>${l} ${v}g<div class="mb"><i style="width:${Math.min(100,v/g*100)}%;background:${col}"></i></div></div>`;
 return `<div class="card">${datebar()}<div class="big" style="margin-top:12px"><div class="ring">${ring(tr.k/S.goal,110,12,'var(--ac)','var(--bg)')}<b style="font-size:13px;text-align:center;line-height:1.1">${tr.k}<br>${t('cals')}</b></div>
 <div class="mac"><div><h2>${Math.abs(left)}</h2>${left>=0?t('left'):t('over')}</div>${mb(t('protein'),tr.p,'var(--p)',S.mt?S.mt.p:150)}${mb(t('carbs'),tr.c,'var(--c)',S.mt?S.mt.c:300)}${mb(t('fats'),tr.f,'var(--f)',S.mt?S.mt.f:80)}</div></div>
 <div class="chips" style="margin-bottom:0"><label class="chip">${t('goal')} <input type="number" value="${S.goal}" onchange="S.goal=+this.value||2500;save();R()"> ${t('cals')}</label></div></div>
 <details class="card" ${cop?'open':''} ontoggle="cop=this.open"><summary>${t('calc')}</summary>
 <div class="two" style="margin-top:10px"><select onchange="cc('sx',this.value)">${opts([['m','ذكر / Male'],['f','أنثى / Female']],cv('sx','m'))}</select><input type="number" inputmode="numeric" placeholder="العمر / Age" value="${esc(cv('a',''))}" oninput="cc('a',this.value)"></div>
 <div class="two" style="margin-top:8px"><input type="number" inputmode="decimal" placeholder="الوزن / Weight (kg)" value="${esc(cv('w',''))}" oninput="cc('w',this.value)"><input type="number" inputmode="decimal" placeholder="الطول / Height (cm)" value="${esc(cv('h',''))}" oninput="cc('h',this.value)"></div>
 <select style="margin-top:8px" onchange="cc('act',+this.value)">${opts(ACT,cv('act',1.55))}</select>
 <select style="margin-top:8px" onchange="cc('g',+this.value)">${opts(GL,cv('g',0))}</select>
 <div id="cres" style="margin-top:12px"></div></details>
 <div class="card"><h3>${t('search')}</h3><input id="fsq" placeholder="${t('search')}" style="text-align:start;margin-top:10px" oninput="fs(this.value)"><div id="frs" class="fr"></div><div id="fpn"></div></div>
 <details class="card"><summary>${t('custom')}</summary><div style="margin-top:10px"><input id="mn" placeholder="الوجبة / Food item" style="text-align:start"></div><div class="g4"><input id="mk" type="number" placeholder="kcal"><input id="mp" type="number" placeholder="protein"><input id="mc" type="number" placeholder="carbs"><input id="mf" type="number" placeholder="fat"></div><button class="add" onclick="am()" style="margin-top:10px">+ Add</button></details>`
 +(L.length?'':cyb()+'<div class="empty">No meals recorded for this day.</div>')
 +L.map((m,i)=>em===i?`<div class="card"><input id="en" value="${esc(m.n)}" style="text-align:start"><div class="g4"><input id="ek" type="number" value="${m.k}"><input id="ep" type="number" value="${m.p}"><input id="ec" type="number" value="${m.c}"><input id="ef" type="number" value="${m.f}"></div><div class="two" style="margin-top:8px"><button class="add" onclick="es(${i})">Save</button><button onclick="em=-1;R()">Cancel</button></div></div>`:`<div class="card ml"><span><b>${esc(m.n)}</b><br><small>${m.k} ${t('cals')} · <span class="dot" style="background:var(--p)"></span>${m.p}g <span class="dot" style="background:var(--c)"></span>${m.c}g <span class="dot" style="background:var(--f)"></span>${m.f}g</small></span><span><button onclick="em=${i};R()">✎</button> <button onclick="dm(${i})">🗑</button></span></div>`).join('');
}

function am(){
 const v=id=>+$('#'+id).value||0,n=$('#mn').value.trim()||'الوجبة';
 const p=v('mp'),c=v('mc'),f=v('mf'),k=v('mk')||Math.round(p*4+c*4+f*9);
 if(!k)return;(S.meals[date]=S.meals[date]||[]).push({n,k,p,c,f});save();R();
}
function dm(i){S.meals[date].splice(i,1);save();R()}
function es(i){
 const v=id=>+$('#'+id).value||0,m=S.meals[date][i],p=v('ep'),c=v('ec'),f=v('ef');
 m.n=$('#en').value.trim()||m.n;m.p=p;m.c=c;m.f=f;m.k=v('ek')||Math.round(p*4+c*4+f*9);
 em=-1;save();R();
}

const FOODS=[
['بيض (مسلوق/مقلي)',155,13,1.1,11,'بيضة',50],['خبز عربي',275,9,56,1.2,'رغيف',60],['توست',265,9,49,3.2,'شريحة',30],
['رز مطبوخ',130,2.7,28,0.3,'صحن',200],['صدر دجاج مشوي',165,31,0,3.6,'صدر',170],['بطاطا مسلوقة',87,1.9,20,0.1,'حبة',150],
['حليب كامل',61,3.2,4.8,3.3,'كوب',240],['تونة معلبة',116,26,0,1,'علبة',120],['شوفان',389,17,66,7,'نص كوب',40],
['واي بروتين',400,80,8,6,'مغرفة',30],['موز',89,1.1,23,0.3,'حبة',120],['تمر',282,2.5,75,0.4,'حبة',10]
];
const allF=()=>FOODS;
const r1=v=>Math.round(v*10)/10;
let fsel=null;
function fs(q){
 q=(q||'').trim();const A=allF(),r=A.filter(f=>nz(f[0]).includes(nz(q)));
 $('#frs').innerHTML=r.map(f=>`<button class="fb" onclick="fp(${A.indexOf(f)})"><span>${esc(f[0])}</span><small>${f[1]} kcal/100g</small></button>`).join('')||'<p class="nt">لم يتم العثور على العنصر.</p>';
}
function fp(i){
 const f=fsel=allF()[i];
 $('#fpn').innerHTML=`<div class="fsel"><b>${esc(f[0])}</b><div class="two" style="margin:8px 0"><input id="fq" type="number" step="any" value="${f[5]?1:100}" oninput="pv()"><select id="fu" onchange="$('#fq').value=this.value=='u'?1:100;pv()">${f[5]?`<option value="u">${esc(f[5])} (~${f[6]}g)</option>`:''}<option value="g">Grams (غرام)</option></select></div><div id="pvw" class="nt"></div><button class="add" onclick="fa()" style="margin-top:10px">+ Add to meals</button></div>`;
 pv();
}
function fg(){const q=+$('#fq').value||0;return $('#fu').value=='u'?q*fsel[6]:q}
function pv(){const m=fg()/100,f=fsel;$('#pvw').innerHTML=`<b style="color:var(--tx);font-size:18px">${Math.round(f[1]*m)} ${t('cals')}</b> · P ${r1(f[2]*m)}g · C ${r1(f[3]*m)}g · F ${r1(f[4]*m)}g`}
function fa(){
 const m=fg()/100,f=fsel,q=+$('#fq').value||0;if(!q)return;
 const u=$('#fu').value=='u';
 (S.meals[date]=S.meals[date]||[]).push({n:`${f[0]} · ${q} ${u?f[5]:'g'}`,k:Math.round(f[1]*m),p:r1(f[2]*m),c:r1(f[3]*m),f:r1(f[4]*m)});
 save();R();
}
const nz=s=>s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652]/g,'');
function pd(d){const x=new Date(d+'T12:00');x.setDate(x.getDate()-1);return iso(x)}
function cyb(){const p=S.meals[pd(date)];return p&&p.length?`<div class="card"><button class="add" onclick="cy()">انسخ وجبات اليوم السابق (${p.reduce((a,m)=>a+m.k,0)} سعرة)</button></div>`:''}
function cy(){const p=S.meals[pd(date)]||[];S.meals[date]=(S.meals[date]||[]).concat(p.map(m=>({...m})));save();R()}
function pgt(i){pg=pg&&pg[0]==di&&pg[1]==i?null:[di,i];R()}
function pc(x){
 const ks=Object.keys(x.wk||{}).map(Number).sort((a,b)=>a-b),vs=ks.map(k=>Math.max(0,...x.wk[k].w.map(v=>+v||0)));
 if(!vs.some(v=>v>0))return '<p class="nt">سجّل أوزان لتشوف التقدم.</p>';
 const n=ks.length,mx=Math.max(...vs),mn=Math.min(...vs),st=n>1?250/(n-1):0,X=i=>n>1?275-i*st:150,Y=v=>mx==mn?50:95-(v-mn)/(mx-mn)*60;
 const pts=vs.map((v,i)=>X(i)+','+Y(v)).join(' ');
 return `<div style="margin-top:12px"><p class="nt" style="margin:0 0 4px">أعلى وزن بكل أسبوع (كغ)</p><svg class="ch" viewBox="0 0 300 120"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>${vs.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--ac)"/><text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${v}</text><text x="${X(i)}" y="115" text-anchor="middle" font-size="10" fill="var(--mu)">W${ks[i]}</text>`).join('')}</svg></div>`;
}

/* ---------- CALCULATOR ---------- */
let cop=false;
const cv=(k,d)=>S.calc&&S.calc[k]!=null?S.calc[k]:d;
const opts=(L,cur)=>L.map(([v,l])=>`<option value="${v}" ${v==cur?'selected':''}>${l}</option>`).join('');
const ACT=[[1.2,'قليل الحركة / Sedentary'],[1.375,'نشاط خفيف / Light Active'],[1.55,'نشاط متوسط / Moderate'],[1.725,'نشاط عالي / High Active']];
const GL=[[-0.2,'خسارة دهون (-20%)'],[0,'ثبات الوزن / Maintain'],[0.1,'زيادة عضل (+10%)']];
function cc(k,v){S.calc=S.calc||{};S.calc[k]=v;save();cr()}
function cr(){
 const e=$('#cres');if(!e)return;
 const a=+cv('a',0),w=+cv('w',0),h=+cv('h',0);
 if(!a||!w||!h){e.innerHTML='<p class="nt">دخّل بياناتك لتشوف النتيجة.</p>';return}
 const bmr=10*w+6.25*h-5*a+(cv('sx','m')=='f'?-161:5),tdee=bmr*cv('act',1.55),t=Math.round(tdee*(1+cv('g',0)));
 const p=Math.round(w*2),f=Math.round(w*0.8),cb=Math.max(0,Math.round((t-p*4-f*9)/4));
 e.innerHTML=`<div class="fsel" style="margin-top:0"><b style="font-size:22px">${t} kcal / day</b><div class="nt" style="margin:4px 0 0">Protein ${p}g · Carbs ${cb}g · Fat ${f}g</div><button class="add" onclick="sg(${t},${p},${cb},${f})" style="margin-top:10px">Set as Daily Goal</button></div>`;
}
function sg(t,p,c,f){S.goal=t;S.mt={p,c,f};save();R()}

/* ---------- SETTINGS ---------- */
function bj(){return JSON.stringify(S)}
function sbk(){S.bk=Date.now();save()}
function cp(){sbk();navigator.clipboard.writeText(bj());alert('Copied!')}
function ex(){sbk();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bj()],{type:'application/json'}));a.download=`workout-backup.json`;a.click()}
function wipe(){if(confirm('Are you sure you want to reset all data?')){localStorage.removeItem(K);location.reload()}}
function setLang(l){S.lang=l;save();R()}

function bn(){return ''}
function RS(){
 return `<div class="card"><h3>${t('lang')}</h3>
 <div class="two" style="margin-top:10px">
   <button class="${S.lang=='ar'?'add':''}" onclick="setLang('ar')">العربية</button>
   <button class="${S.lang=='en'?'add':''}" onclick="setLang('en')">English</button>
 </div></div>
 <div class="card"><h3>Backup & Export</h3>
 <div class="two" style="margin-top:8px"><button onclick="cp()">📋 Copy Data</button><button onclick="ex()">⬇️ Download File</button></div>
 </div>
 <div class="card"><button onclick="wipe()" style="width:100%;color:#d33">Reset All Data</button></div>`;
}

/* ---------- CHART ---------- */
function RC(){
 const ds=[];for(let i=6;i>=0;i--){const d=new Date(date+'T12:00');d.setDate(d.getDate()-i);ds.push(iso(d))}
 const TT=ds.map(tot),mx=Math.max(S.goal,...TT.map(t=>t.k),1)*1.15,H=150,gy=H+10-S.goal/mx*H;
 let s=`<div class="card"><h3>${t('cal')} (7 Days)</h3><svg class="ch" viewBox="0 0 330 200"><line x1="0" x2="330" y1="${gy}" y2="${gy}" stroke="var(--mu)" stroke-dasharray="4"/>`;
 TT.forEach((t,i)=>{
  const x=(6-i)*47+18,h=t.k>0?Math.max(4,(t.k/mx)*H):0,y=H+10-h;
  s+=`<rect x="${x-12}" y="${y}" width="24" height="${h}" rx="6" fill="var(--ac)" opacity="${ds[6-i]==date?1:0.6}"/><text x="${x}" y="${y-6}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx)">${t.k?t.k:''}</text><text x="${x}" y="180" text-anchor="middle" font-size="10" fill="var(--mu)">${ds[6-i].slice(8)}</text>`;
 });
 s+=`</svg></div>`;
 return s;
}

R();
</script>
</body>
</html>
