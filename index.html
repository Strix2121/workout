<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a3bf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تمارين">

<title>برنامجي التدريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fa;--bgA:rgba(243,244,250,.82);--card:#fff;--tx:#12172b;--mu:#69708c;--ac:#5b4bff;--tint:#eeecff;--ln:#e4e7f1;--hero:#4535e8;--hero2:#8b5cff;--sh:0 1px 2px rgba(18,23,43,.05),0 10px 28px rgba(18,23,43,.07);--p:#ff5d5d;--c:#ffb020;--f:#12b5a6;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0a0d19;--bgA:rgba(10,13,25,.82);--card:#141930;--tx:#eef0fb;--mu:#97a0c2;--ac:#9488ff;--tint:#23205a;--ln:#252b48;--hero:#3a2fc4;--hero2:#6a46e0;--sh:0 0 0 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Tajawal,Tahoma,system-ui,sans-serif;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
html[lang=en] body{font-family:Inter,Tajawal,system-ui,sans-serif}
main{max-width:600px;margin:auto;padding:6px 14px 14px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:var(--tint);color:var(--ac);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;transition:transform .12s,background .2s,opacity .2s}
button:active{transform:scale(.96)}
input{width:100%;min-width:0;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:11px 10px;text-align:center;font-weight:700;transition:border-color .2s,background .2s}
input:focus,select:focus{outline:0;border-color:var(--ac)}
input::placeholder{font-weight:400;color:var(--mu)}
h2,h3,p{margin:0}
h3{font-size:17px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* header */
#top{position:sticky;top:0;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(16px,calc((100% - 600px)/2 + 14px)) 10px;background:var(--bgA);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.brand small{color:var(--mu);font-size:12px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--hero),var(--hero2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px rgba(91,75,255,.35)}
.seg{display:inline-flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--sh)}
.seg button{background:none;color:var(--mu);padding:6px 13px;font-size:13px;font-weight:800;border-radius:11px}
.seg button.on{background:var(--ac);color:#fff}
/* nav */
#nav{position:fixed;inset:auto 12px calc(10px + env(safe-area-inset-bottom)) 12px;max-width:576px;margin:auto;z-index:8;display:flex;gap:4px;padding:6px;background:var(--card);border-radius:26px;box-shadow:0 14px 34px rgba(18,23,43,.2),0 0 0 1px var(--ln)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--mu);font-size:11px;font-weight:700;padding:4px 0;border-radius:20px}
#nav .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
#nav .on{color:var(--ac)}
#nav .on .ic{background:var(--tint)}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero),var(--hero2));color:#fff;border-radius:26px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;box-shadow:0 14px 30px rgba(69,53,232,.28)}
.hero:before{content:"";position:absolute;inset-inline-end:-46px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero>*{position:relative}
.hero small{opacity:.85}
.hero input{background:rgba(255,255,255,.16);color:#fff;font-size:22px;font-weight:800;text-align:start;padding:4px 10px;width:170px;margin:2px -10px}
.hero .st{display:flex;gap:16px;margin-top:8px;font-size:14px}
.hero b{font-size:18px}
.ring{position:relative;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
/* days */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.days button{flex:0 0 auto;width:64px;padding:9px 0;background:var(--card);color:var(--tx);display:flex;flex-direction:column;align-items:center;line-height:1.25;border-radius:18px;box-shadow:var(--sh)}
.days button b{font-size:18px}
.days small{font-size:11px;color:var(--mu);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days button.on{background:linear-gradient(135deg,var(--hero),var(--hero2));color:#fff}
.days button.on small{color:#fff;opacity:.9}
.days button.rest:not(.on){opacity:.6}
/* exercise */
.ex,.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.ex.fin{box-shadow:inset 0 0 0 2px var(--f),var(--sh)}
.eh{display:flex;align-items:center;gap:10px}
.eh .n{flex:none;width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--hero),var(--hero2));color:#fff;display:grid;place-items:center;font-weight:800}
.eh h3{flex:1;font-size:16px;line-height:1.35}
.eh button{padding:4px 7px;background:none;color:var(--mu)}
.chips{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:13px;padding:3px 10px;font-size:14px;color:var(--mu)}
.chip input{width:54px;padding:5px;background:var(--card)}
.chip button{padding:2px 10px;font-size:18px;line-height:1.2}
.cols,.set{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center}
.cols{font-size:12px;color:var(--mu);text-align:center;margin-bottom:2px}
.set{margin:7px 0}
.set input{font-size:17px}
.set>span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-weight:800;color:var(--mu)}
.set .ok{width:46px;height:46px;border-radius:50%;padding:0;background:var(--bg);color:transparent;font-size:20px}
.set.done .ok{background:var(--f);color:#fff}
.set.done input{background:var(--tint)}
.set.done>span{background:var(--f);color:#fff}
.add{width:100%;background:linear-gradient(135deg,var(--hero),var(--hero2));color:#fff;padding:13px;font-size:16px;border-radius:16px;box-shadow:0 8px 18px rgba(91,75,255,.28)}
.nt{color:var(--mu);font-size:13px;margin-top:12px}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.dt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dt b{font-size:17px}
.big{display:flex;align-items:center;gap:16px}
.big h2{font-size:30px;font-weight:800;line-height:1.1}
.mac{flex:1;display:grid;gap:8px}
.mac div{font-size:13px;color:var(--mu)}
.mb{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:3px}
.mb i{display:block;height:100%;border-radius:6px;transition:width .4s}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.ml{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ml small{color:var(--mu)}
.mr{display:flex;justify-content:space-between;gap:6px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh h3{margin:0}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.sc{flex:none;width:150px;scroll-snap-align:start;background:var(--bg);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sc b{font-size:14px;line-height:1.3;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc small{color:var(--mu);font-size:12px}
.sc .kc{font-size:20px;font-weight:800;color:var(--tx)}
.sc .kc small{font-weight:500}
.sc button{margin-top:6px;padding:8px;font-size:14px}
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:50}
.sh-bg{position:absolute;inset:0;background:rgba(10,12,30,.55)}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--card);color:var(--tx);border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h h3{margin:0}
#sheet .fr{max-height:34vh}
.nt.ok{color:#2fbf71;font-weight:700;text-align:center;margin:8px 0}
.gh{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:14px}
.gh>span{flex:1}
.gh small{color:var(--mu);font-weight:500}
.gh button{padding:4px 12px;font-size:16px}
.gh+.sr{border-top:0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90%;text-align:center}
.xi{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mu);font-size:12px;margin:8px 0 2px}
.sug{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--tint);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--tx)}
.sug button{padding:6px 14px;font-size:13px;flex:none}
.xn{margin-top:10px}
.xn summary{color:var(--mu);font-size:13px}
.xn .two{margin:8px 0}
.kpg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kp{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.kp b{display:block;font-size:20px;color:var(--tx);line-height:1.3}
.kp small{display:block;color:var(--mu);font-size:12px;min-height:15px}
.hmg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.hmg small{text-align:center;color:var(--mu);font-size:11px}
.hm{aspect-ratio:1;border-radius:8px;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--mu);background:var(--bg)}
.hm.l-1{visibility:hidden}
.hm.l1{background:var(--tint)}
.hm.l1{background:color-mix(in srgb,var(--ac) 28%,transparent)}
.hm.l2{background:color-mix(in srgb,var(--ac) 52%,transparent);color:var(--tx)}
.hm.l3{background:color-mix(in srgb,var(--ac) 78%,transparent);color:#fff}
.hm.l4{background:var(--ac);color:#fff}
.qb{max-height:260px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 10px;border:1px solid var(--ln);border-radius:16px}
.qb .sr:first-child{border-top:0}
.cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.cup{width:28px;height:34px;border-radius:8px 8px 13px 13px;background:var(--bg);border:2px solid var(--ln);padding:0}
.cup.on{background:#3b9bff;border-color:#3b9bff}
.sr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.sr>span:first-child{flex:1;min-width:0}
.sa{flex:none;display:flex;gap:2px}
.sa button{background:none;padding:6px 9px;font-size:16px}
.mac .mr{font-size:12px}
.ed{padding:10px 0;border-top:1px solid var(--ln)}
.sr small{display:block;color:var(--mu);font-size:12px}
.sr button{flex:none;padding:6px 14px;font-size:18px}
.sh{font-weight:800;margin-top:14px;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px}
.ch{width:100%;height:auto}
.ch text{font-family:inherit}
.dn{width:160px;height:160px;border-radius:50%;margin:12px auto;display:grid;place-items:center}
.dn div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.2;font-weight:800}
.dn small{display:block;font-weight:400;color:var(--mu)}
.lg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ses{display:grid;gap:12px;text-align:center}
.ses .sl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.ses .sd{font-size:48px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr;line-height:1;color:var(--tx)}
.ses.run .sd{color:var(--ac)}
.ses .two button{padding:13px;font-size:15px;border-radius:16px}
.ses .stop{background:rgba(229,72,77,.14);color:#e5484d}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2fbf71;margin-inline-end:6px;animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(47,191,113,.6)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.sp{padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums;direction:ltr;display:flex;align-items:center}

.fr{display:grid;gap:6px;max-height:300px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:10px 0;padding:8px;border:1px solid var(--ln);border-radius:16px;align-content:start}
.fb{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);color:var(--tx);font-weight:500;text-align:start;border-radius:14px}
.fb small{color:var(--mu);white-space:nowrap}
.fsel{background:var(--tint);border-radius:18px;padding:12px;margin-top:8px}
select{width:100%;background:var(--bg);color:var(--tx);border:1.5px solid transparent;border-radius:14px;padding:11px 10px;font-weight:700}
details summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"⌄";color:var(--mu);font-size:18px;transition:transform .2s}
details[open] summary:after{transform:rotate(180deg)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.cats button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--bg);color:var(--tx);font-size:13px;white-space:nowrap}
.cats button.on{background:var(--ac);color:#fff}
.cats small{opacity:.65;margin-inline-start:5px;font-weight:500}
/* timer */
#tb{position:fixed;inset:auto 14px calc(92px + env(safe-area-inset-bottom)) 14px;max-width:572px;margin:auto;z-index:9;background:var(--tx);color:var(--bg);border-radius:20px;padding:10px 12px 10px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
#tb[hidden]{display:none}
#tb button{background:rgba(128,128,128,.3);color:inherit}
</style>
</head>

<div id="tb" hidden><span></span><button onclick="clearInterval(T);tb.hidden=true">إيقاف</button></div>
<nav id="nav"></nav>
<div id="sheet" hidden></div>
<script>
const K='ali-shahidah-v1';
const mk=(n,s,r)=>({n,s,r,wk:{1:{w:Array(s).fill(''),q:Array(s).fill(''),d:Array(s).fill(false)}}});
const def=()=>({goal:2500,week:1,meals:{},days:[
{t:'Push',e:[mk('ضغط دمبل مائل للأعلى (صدر)',4,3),mk('فراشة صدر',3,2),mk('ضغط دمبل جانبي (أكتاف)',2,3),mk('رفرفة جانبية (كتف جانبي)',3,2),mk('دفع سيخ خلف الرأس (ترايسبس)',3,2),mk('دفع سيخ للأسفل (ترايسبس)',3,2),mk('طحن معدة بالحبل',3,2)]},
{t:'Pull',e:[mk('سحب أمامي ضيق',3,3),mk('تجديف ظهر ضيق',3,2),mk('تجديف ظهر عريض',2,2),mk('كيبل يد واحدة (كتف خلفي)',3,1.5),mk('دمبل متسع مائل (بايسبس)',3,1.5),mk('مطرقة',3,1.5),mk('كرسي روماني',3,1.5)]},
{t:'راحة',e:[]},
{t:'Legs',e:[mk('هاك سكوات',3,3),mk('RDL هامسترينغ',3,3),mk('رد أمامي',3,2),mk('رد خلفي',3,2),mk('مقرّبات',3,1.5),mk('بطات واقفة',3,1.5),mk('فواصل يد واحدة',2,1.5)]},
{t:'راحة',e:[]},
{t:'Upper',e:[mk('فتح كيبل صدر علوي',3,2),mk('سحب بولي داون',3,3),mk('رفرفة جانبية بالكيبل',3,2),mk('سحب يد واحدة (كتف خلفي)',2,1.5),mk('دفع سيخ خلف الرأس (ترايسبس)',3,2),mk('تبادل دمبل (بايسبس)',2,1.5),mk('دوران جذع بالكيبل',2,1.5)]},
{t:'راحة',e:[]}]});
try{localStorage.removeItem('ali-ai-key')}catch(e){}
let S,SNAP=null,SNAPD='';
try{const raw=localStorage.getItem(K);try{S=JSON.parse(raw)}catch(e){if(raw)localStorage.setItem(K+'-bad',raw)}}catch(e){}
S=S||def();
try{const r=localStorage.getItem(K+'-snap');if(r){const d=JSON.parse(r);if(d&&d.days&&d.meals)SNAP=d}SNAPD=localStorage.getItem(K+'-sd')||''}catch(e){}
function mig(d){d.week=d.week||1;d.days.forEach(y=>y.e.forEach(x=>{if(!x.wk){x.wk={1:{w:x.w||[],q:x.q||(x.w||[]).map(()=> ''),d:x.d||[]}};delete x.w;delete x.q;delete x.d}}));return d}
mig(S);
const save=()=>{try{S.sv=Date.now();const j=JSON.stringify(S);localStorage.setItem(K,j);if(hasD()){const d=iso(new Date());if(localStorage.getItem(K+'-sd')!==d){localStorage.setItem(K+'-sd',d);localStorage.setItem(K+'-snap',j)}}}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
let LANG=S.lang||'ar',em=-1,tab='w',di=0,date=today(),T=null,pg=null;
const go=t=>{bsx();tab=t;scrollTo(0,0);R()};
function ring(p,sz,sw,col,track){const r=(sz-sw)/2,c=2*Math.PI*r;return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}"/></svg>`}
function R(){
 $('#top').innerHTML=TOP();
 $('#nav').innerHTML=[['w','التمارين'],['m','السعرات'],['c','الرسم'],['s','الإعدادات']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><i class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg></i>${l}</button>`).join('');
 $('#v').innerHTML=bn()+(tab=='w'?RW():tab=='m'?RM():tab=='c'?RC():RS());
 if(tab=='m'){shR();cr()}
 if(tab=='s')pst();
}
/* ---------- التمارين ---------- */

function recents(){const o=[],seen={};for(const d of Object.keys(S.meals).sort().reverse()){const L=S.meals[d]||[];for(let i=L.length-1;i>=0;i--){const m=L[i];if(seen[m.n])continue;seen[m.n]=1;o.push({n:m.n,k:m.k,p:m.p,c:m.c,f:m.f});if(o.length>=15)return o}}return o}
const modeTabs=()=>[['q','⚡ سريع'],['f','🔎 كل الأكل']].map(([k,l])=>`<button class="${shm==k?'on':''}" onclick="setMode('${k}')">${l}</button>`).join('');
const qrow=(x,b,sub)=>`<div class="sr"><span><b>${esc(x.n)}</b><small>${sub||`${x.k} سعرة · ${dots(x)}`}</small></span><span class="sa">${b}</span></div>`;
function qBody(){
 const fv=S.fav||[],tp=S.tpl||[];QL=[];
 let h=`<div class="cats" style="padding:0 0 6px">${[['r','🕘 الأخيرة'],['v','⭐ المفضلة'],['t','🍱 قوالب']].map(([k,l])=>`<button class="${shq==k?'on':''}" onclick="setQ('${k}')">${l}</button>`).join('')}</div>`;
 if(shq=='r'){QL=recents();h+=QL.length?`<div class="qb">${QL.map((x,i)=>qrow(x,`<button class="add" onclick="qadd(${i})">+</button><button onclick="qfav(${i})">${fv.some(f=>f.n==x.n)?'★':'☆'}</button>`)).join('')}</div>`:`<p class="nt">لما تسجل وجبات، آخر أكلاتك بتطلع هون.</p>`}
 else if(shq=='v'){QL=fv.slice();h+=QL.length?`<div class="qb">${QL.map((x,i)=>qrow(x,`<button class="add" onclick="qadd(${i})">+</button><button onclick="qfd(${i})">✕</button>`)).join('')}</div>`:`<p class="nt">ما في مفضلة بعد. اضغط ☆ على أي أكلة بالأخيرة.</p>`}
 else h+=tp.length?`<div class="qb">${tp.map((t,i)=>qrow({n:t.n},`<button class="add" onclick="tadd(${i})">+</button><button onclick="tdel(${i})">🗑</button>`,`${t.items.length>1?t.items.length+' أصناف':'صنف واحد'} · ${t.items.reduce((a,m)=>a+m.k,0)} سعرة`)).join('')}</div>`:`<p class="nt">ما في قوالب. اضغط 💾 جنب عنوان الوجبة لتحفظها.</p>`;
 return h+`<div id="fpn"></div>`;
}
const shBody=()=>shm=='f'?`<input id="fsq" placeholder="ابحث: دجاج، رز، بيض..." style="text-align:start" oninput="fs(this.value)"><div id="fct">${chips()}</div><div id="frs" class="fr"></div><div id="fpn"></div>`:qBody();
function shRe(){const b=$('#shb'),m=$('#smd');if(!b)return;if(m)m.innerHTML=modeTabs();b.innerHTML=shBody();if(shm=='f')fs('')}
function setMode(k){shm=k;shRe()}
function setQ(k){shq=k;shRe()}
const addM=(x)=>{(S.meals[date]=S.meals[date]||[]).push({n:x.n,k:x.k,p:x.p,c:x.c,f:x.f,s:curSl()})};
function qadd(i){const x=QL[i];if(!x)return;addM(x);save();R();shOk(x.n)}
function qfav(i){const x=QL[i];if(!x)return;S.fav=S.fav||[];const j=S.fav.findIndex(f=>f.n==x.n);if(j>=0)S.fav.splice(j,1);else S.fav.push({n:x.n,k:x.k,p:x.p,c:x.c,f:x.f});save();shRe()}
function qfd(i){const x=QL[i];if(!x)return;S.fav=(S.fav||[]).filter(f=>f.n!=x.n);save();shRe()}
function tadd(i){const t=(S.tpl||[])[i];if(!t)return;t.items.forEach(addM);save();R();shOk(t.n)}
function tdel(i){if(!confirm('تحذف هالقالب؟'))return;S.tpl.splice(i,1);save();shRe()}
function tps(key){const L=(S.meals[date]||[]).filter(m=>m.s==key);if(!L.length)return;const sl=SLOTS.find(x=>x[0]==key),n=prompt('اسم القالب',sl?sl[2]:'');if(!n)return;(S.tpl=S.tpl||[]).push({n:n.trim(),items:L.map(m=>({n:m.n,k:m.k,p:m.p,c:m.c,f:m.f}))});save();toast('✓ انحفظ القالب: '+n.trim())}
/* ---------- الماء ---------- */
function wset(n){S.wt=S.wt||{};S.wt[date]=Math.max(0,n);save();R()}
function WTR(){const n=(S.wt||{})[date]||0,g=Math.max(8,n);return `<div class="card"><div class="mh"><h3>💧 الماء</h3><span class="sa"><button onclick="wset(${n-1})">−</button><b style="align-self:center;min-width:64px;text-align:center">${n*.25} لتر</b><button onclick="wset(${n+1})">+</button></span></div><div class="cups">${Array.from({length:g},(_,i)=>`<button class="cup ${i<n?'on':''}" onclick="wset(${i<n&&i==n-1?i:i+1})"></button>`).join('')}</div><p class="nt" style="margin:8px 0 0">الكاسة = 250 مل · الهدف 2 لتر</p></div>`}
/* ---------- نافذة إضافة أكل ---------- */
const shHTML=()=>`<div class="sh-bg" onclick="closeSheet()"></div><div class="sh-box"><div class="sh-h"><h3>➕ أضف أكل</h3><button onclick="closeSheet()">✕</button></div>
 <div class="cats" id="ssl" style="padding:0 0 10px">${slotTabs()}</div>
 <div class="cats" id="smd" style="padding:0 0 10px">${modeTabs()}</div><div id="shb">${shBody()}</div>
 <div class="two" style="margin-top:8px"><button onclick="bs()">▥ باركود</button><button onclick="const e=$('#mdt');e.hidden=!e.hidden">✍️ يدوي</button></div><div id="cam"></div>
 <div id="mdt" hidden style="margin-top:10px"><input id="mn" placeholder="اسم الوجبة" style="text-align:start"><div class="g4"><input id="mk" type="number" inputmode="decimal" placeholder="سعرات"><input id="mp" type="number" inputmode="decimal" placeholder="بروتين"><input id="mc" type="number" inputmode="decimal" placeholder="كارب"><input id="mf" type="number" inputmode="decimal" placeholder="دهون"></div><label class="nt"><input id="ms" type="checkbox" style="width:20px;height:20px;vertical-align:middle"> احفظها بقائمة الأكل (كحصة)</label><select id="mcat" style="margin-top:8px">${catOpts('my')}</select><button class="add" onclick="am()" style="margin-top:10px">+ أضف</button><p class="nt">اترك السعرات فاضية وبنحسبها من الماكروز.</p></div></div>`;
function openSheet(k){if(k)msl=k;shm=(recents().length||(S.fav||[]).length||(S.tpl||[]).length)?'q':'f';const e=$('#sheet');e.innerHTML=shHTML();e.hidden=false;document.body.style.overflow='hidden';if(shm=='f')fs('')}
function closeSheet(){msl=null;bsx();const e=$('#sheet');if(!e)return;e.innerHTML='';e.hidden=true;document.body.style.overflow=''}
const shOk=n=>{const e=$('#fpn');if(e){const sl=SLOTS.find(x=>x[0]==curSl());e.innerHTML=`<p class="nt ok">✓ ${esc(n)} · ${sl[1]} ${sl[2]}</p>`}};
function am(){
 const v=id=>+$('#'+id).value||0,n=$('#mn').value.trim()||'وجبة';
 const p=v('mp'),c=v('mc'),f=v('mf'),k=v('mk')||Math.round(p*4+c*4+f*9);
 if(!k)return;if($('#ms')&&$('#ms').checked)(S.foods=S.foods||[]).push([n,k,p,c,f,'حصة',100,$('#mcat')?$('#mcat').value:'my']);(S.meals[date]=S.meals[date]||[]).push({n,k,p,c,f,s:curSl()});save();R();['mn','mk','mp','mc','mf'].forEach(i=>{const e=$('#'+i);if(e)e.value=''});shOk(n);
}
function dm(i){if(!confirm('احذف هالوجبة؟'))return;S.meals[date].splice(i,1);save();R()}
function es(i){
 const v=id=>+$('#'+id).value||0,m=S.meals[date][i],p=v('ep'),c=v('ec'),f=v('ef');
 m.n=$('#en').value.trim()||m.n;{const sv=$('#es');if(sv&&sv.value)m.s=sv.value}m.p=p;m.c=c;m.f=f;m.k=v('ek')||Math.round(p*4+c*4+f*9);
 em=-1;save();R();
}

function xDet(x,i){return `<details class="xn"><summary>📝 ملاحظات وهدف العدات${x.note?' •':''}</summary><div class="two"><label class="nt" style="margin:0">هدف العدات<input type="number" inputmode="numeric" value="${x.tr||12}" onchange="S.days[di].e[${i}].tr=+this.value||12;save();R()"></label><label class="nt" style="margin:0">ملاحظة<input value="${esc(x.note||'')}" placeholder="ضبط الجهاز، إحساس..." style="text-align:start" onchange="S.days[di].e[${i}].note=this.value;save()"></label></div></details>`}
function xap(i,w){const o=E(i);o.w=o.w.map(()=>String(w));save();R()}
function volByWeek(){const V={};S.days.forEach(d=>d.e.forEach(x=>Object.keys(x.wk||{}).forEach(k=>{const r=x.wk[k];(r.w||[]).forEach((w,j)=>{if(r.d&&r.d[j])V[k]=(V[k]||0)+nn(w)*nn((r.q||[])[j])})})));return V}
function RWK(TT){
 const G=S.goal,P=MT().p,tr=TT.filter(t=>t.k>0),n=tr.length,ak=n?Math.round(tr.reduce((a,t)=>a+t.k,0)/n):0,ap=n?Math.round(tr.reduce((a,t)=>a+t.p,0)/n):0,ok=tr.filter(t=>Math.abs(t.k-G)<=G*.1).length;
 const tl=(l,v,sb)=>`<div class="kp"><small>${l}</small><b>${v}</b><small>${sb}</small></div>`;
 return `<div class="card"><h3>📊 ملخص آخر 7 أيام</h3><div class="kpg">${tl('متوسط السعرات',n?ak:'—',n?pcn(ak,G)+'%':'')}${tl('متوسط البروتين',n?ap+'غ':'—',n?pcn(ap,P)+'%':'')}${tl('ضمن الهدف',n?ok+'/'+n:'—','±10%')}${tl('أيام مسجلة',n+'/7','')}</div></div>`;
}
function RVOL(){
 const V=volByWeek(),wk=S.week,ks=[];for(let k=Math.max(1,wk-7);k<=wk;k++)ks.push(k);
 const vs=ks.map(k=>Math.round(V[k]||0)),mx=Math.max(...vs,1);
 if(!vs.some(v=>v>0))return `<div class="card"><h3>🏋️ حجم التمرين الأسبوعي</h3><p class="nt">علّم مجموعاتك ✓ مع الوزن والعدات لتشوف الحجم الأسبوعي.</p></div>`;
 const n=ks.length,st=330/n,bw=Math.min(34,st-8);let g=`<svg class="ch" viewBox="0 0 330 150">`;
 ks.forEach((k,i)=>{const x=(LANG=='en'?i:n-1-i)*st+(st-bw)/2,h=vs[i]/mx*105,y=125-h;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${k==wk?'var(--ac)':'var(--ln)'}"/><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx)">${vs[i]>=1000?(vs[i]/1000).toFixed(1)+'k':(vs[i]||'')}</text><text x="${x+bw/2}" y="142" text-anchor="middle" font-size="10" fill="var(--mu)">أ${k}</text>`});
 return `<div class="card"><h3>🏋️ حجم التمرين الأسبوعي</h3>${g}</svg><p class="nt" style="margin-top:0">الحجم = الوزن × العدات لكل المجموعات اللي علّمتها ✓ (كغ).</p></div>`;
}
function RHM(){
 const t=new Date(today()+'T12:00'),dow=(t.getDay()+1)%7,st=new Date(t);st.setDate(t.getDate()-dow-28);
 const TL=S.tl||{},DU=S.dur||{};let hd='',h='',cnt=0;
 for(let c=0;c<7;c++){const d=new Date(st);d.setDate(st.getDate()+c);hd+=`<small>${d.toLocaleDateString(LG(),{weekday:'narrow'})}</small>`}
 for(let i=0;i<35;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=iso(d),fut=d>t,n=TL[k]||0,act=n>0||DU[k]>0;if(!fut&&act)cnt++;h+=`<i class="hm l${fut?-1:n>=15?4:n>=9?3:n>=4?2:act?1:0}">${d.getDate()}</i>`}
 return `<div class="card"><h3>📅 تقويم التمارين</h3><div class="hmg">${hd}${h}</div><p class="nt" style="margin-bottom:0">${cnt?`تمرنت ${cnt} يوم بآخر 5 أسابيع. `:''}كل مربع يوم، وكل ما كان أغمق كل ما كانت المجموعات أكتر. بيتسجل من هلأ ورايح.</p></div>`;
}
function RPR(){
 const M={};S.days.forEach(d=>d.e.forEach(x=>{const a=dsets(x);if(!a.length)return;const bw=Math.max(...a.map(z=>z.w)),be=Math.max(...a.map(z=>e1(z.w,z.q))),tp=a.filter(z=>z.w==bw).sort((p,q)=>q.q-p.q)[0],m=M[x.n];if(!m||be>m.be)M[x.n]={bw,q:tp.q,be}}));
 const L=Object.entries(M).sort((a,b)=>b[1].be-a[1].be);
 return `<div class="card"><h3>🏆 أرقامك القياسية</h3>${L.length?`<div class="qb" style="margin-top:10px">${L.map(([n,m])=>`<div class="sr"><span><b>${esc(n)}</b><small>${m.bw} كغ × ${m.q||'?'} عدة</small></span><span style="flex:none;color:var(--mu);font-size:12px">1RM≈${Math.round(m.be)}</span></div>`).join('')}</div>`:`<p class="nt">علّم مجموعاتك ✓ لتظهر أرقامك هون.</p>`}</div>`;
}
function RC(){
 const ds=[];for(let i=6;i>=0;i--){const d=new Date(date+'T12:00');d.setDate(d.getDate()-i);ds.push(iso(d))}
 const TT=ds.map(tot),mx=Math.max(S.goal,...TT.map(t=>t.k),1)*1.15,H=150,gy=H+10-S.goal/mx*H;
 let s=`<svg class="ch" viewBox="0 0 330 200"><line x1="0" x2="330" y1="${gy}" y2="${gy}" stroke="var(--mu)" stroke-dasharray="4"/>`;
 TT.forEach((t,i)=>{
  const x=(LANG=='en'?i:6-i)*47+8;let y=H+10;const o=Math.max(0,t.k-t.p*4-t.c*4-t.f*9);
  [[t.p*4,'--p'],[t.c*4,'--c'],[t.f*9,'--f'],[o,'--ln']].forEach(([v,c])=>{const h=v/mx*H;y-=h;s+=`<rect x="${x}" y="${y}" width="34" height="${h}" fill="var(${c})" rx="3"/>`});
  s+=`<text x="${x+17}" y="${y-4}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx)">${t.k||''}</text><text x="${x+17}" y="190" text-anchor="middle" font-size="10" fill="var(--mu)">${new Date(ds[i]+'T12:00').toLocaleDateString(LG(),{weekday:'short'})}</text>`;
 });
 s+='</svg>';
 const t=tot(date),a=t.p*4,b=t.c*4,c=t.f*9,sum=a+b+c,pa=a/sum*100,pb=pa+b/sum*100,pc=v=>sum?Math.round(v/sum*100):0;
 const bg=sum?`conic-gradient(var(--p) 0 ${pa}%,var(--c) ${pa}% ${pb}%,var(--f) ${pb}% 100%)`:'var(--ln)';
 const lg=(l,g,col,v)=>`<span><i class="dot" style="background:${col}"></i>${l} ${g}غ (${pc(v)}%)</span>`;
 return `<div class="card">${datebar()}</div>
 ${RWK(TT)}<div class="card"><h3>آخر 7 أيام</h3>${s}<p class="nt" style="margin-top:0">الخط المتقطع هو هدفك اليومي (${S.goal} سعرة).</p></div>
 ${RVOL()}${RHM()}${RPR()}<div class="card"><h3>شو بيحتوي أكل ${dname(date)}</h3><div class="dn" style="background:${bg}"><div><span>${t.k}<small>سعرة</small></span></div></div>
 <div class="lg">${lg('بروتين',t.p,'var(--p)',a)}${lg('كارب',t.c,'var(--c)',b)}${lg('دهون',t.f,'var(--f)',c)}</div></div>
 `;
}
